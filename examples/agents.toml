[[agents]]
id = "claude"
name = "Claude"
provider = "claude"
role = "Explore concrete ideas and improve the work. Speak only for yourself."
executable = "claude"
workspace = "."
timeout = 180

[[agents]]
id = "codex"
name = "Codex"
provider = "codex"
role = "Challenge assumptions and verify engineering claims. Speak only for yourself."
executable = "codex"
workspace = "."
