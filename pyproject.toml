[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kifoundry-home"
version = "0.1.0"
description = "A local shared AI home with real, bounded Council conversations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kifoundry-home = "home.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.package-data]
home = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/*.webp", "web/*.ttf"]

[tool.setuptools.data-files]
"share/kifoundry-home/font-licenses" = ["docs/font-licenses/*.txt"]

[tool.setuptools.packages.find]
include = ["home*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
