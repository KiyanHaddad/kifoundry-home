name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q home scripts
      - run: python -m ruff check home tests scripts
      - run: python -m mypy home
      - run: node --check home/web/app.js
      - run: node --check home/web/http.js
      - run: node --check home/web/world.js
      - run: node --check home/web/world-layout.js
      - run: node --check home/web/world-camera.js
      - run: node --check home/web/world-terrain.js
      - run: node --check home/web/resident-directory.js
      - run: node --check home/web/room.js
      - run: node --check home/web/working-desk.js
      - run: python scripts/check_public_tree.py
      - run: python scripts/check_public_tree.py --tracked
      - run: python scripts/check_public_tree.py --history
